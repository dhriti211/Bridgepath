# Render Blueprint: one free web service built from the Dockerfile.
# In Render: New > Blueprint > pick this repo, then paste the two API keys when asked.
services:
  - type: web
    name: bridgepath
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NEBIUS_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: DEMO_MODE
        value: live
      # Spend guard for a public demo (about a dozen fresh roadmaps a day).
      # Saved example runs replay for free and don't count.
      - key: MAX_LLM_CALLS_PER_DAY
        value: "60"
      - key: MAX_SEARCHES_PER_DAY
        value: "150"
      - key: RATE_LIMIT_PER_HOUR
        value: "10"
